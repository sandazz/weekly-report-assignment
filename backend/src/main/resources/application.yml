spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/weekly_report_db
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

# jwt.secret has a dev-only fallback; override JWT_SECRET in real environments
jwt:
  secret: ${JWT_SECRET:dev-only-insecure-fallback-change-me}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
